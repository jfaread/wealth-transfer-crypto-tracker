name: Verify and publish XRP check-result correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-xrp-check-result.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'jfaread/wealth-transfer-crypto-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproduce and apply the pinned reviewed fix with precise observation assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const original=execFileSync('git',['show','7257e84db582f707e0982a87f5286abba2ea5413:.github/workflows/fix-xrp-check-result.yml'],{encoding:'utf8'});
          const match=original.match(/          node --input-type=module <<'NODE'\n([\s\S]*?)\n          NODE/);
          if(!match)throw Error('Pinned guarded repair missing');
          const script=match[1].split('\n').map(line=>{if(!line.startsWith('          '))throw Error('Unexpected indentation');return line.slice(10);}).join('\n');
          execFileSync(process.execPath,['--input-type=module'],{input:script,stdio:['pipe','inherit','inherit']});
          const file='scripts/test-fast-load.cjs',text=fs.readFileSync(file,'utf8');
          const old='assert.deepEqual(afterChecked.series[0].last,beforeChecked.series[0].last);';
          if(text.split(old).length!==2)throw Error('Unexpected observation assertion');
          fs.writeFileSync(file,text.replace(old,`assert.equal(afterChecked.series[0].last.p,beforeChecked.series[0].last.p);assert.equal(afterChecked.series[0].last.t,beforeChecked.series[0].last.t);
           // The return is relative to the newly rolled window, not the old baseline.
           const checkedSaved=await checkedXrp.page.evaluate(()=>JSON.parse(localStorage.getItem('wtct:v3:range:1D')));
           const checkedSeries=new Map(checkedSaved.data).get('XRP');
           assert(Math.abs(afterChecked.series[0].last.r-(afterChecked.series[0].last.p/checkedSeries.base-1)*100)<1e-9);
           assert.deepEqual(checkedSaved.spec.quoteRefresh.retainedIds,[]);assert.deepEqual(checkedSaved.spec.quoteRefresh.preservedIds,['XRP']);`));
          NODE
      - name: Compile and run the full regression suite
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Refresh dated backup prices and due history without bypassing provider limits
        run: |
          node scripts/refresh-quotes.mjs
          node scripts/refresh-market-data.mjs
          node scripts/refresh-creator-updates.mjs
      - name: Verify publication, real browser controls and all nine coins
        run: |
          npm run build
          node scripts/verify-market-publication.mjs
          npm run test:charts
          npm run test:alerts-browser
          node scripts/test-news-browser.cjs
      - name: Publish only the exact verified revision
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo 'Main changed; refusing to overwrite concurrent work.'; exit 1; }
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add index.html tests/browser-data-hardening.test.mjs scripts/test-fast-load.cjs data
          git commit -m 'Distinguish a successful older quote check from an outage without rolling prices back'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Refuse an obsolete deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xrp-check-result-verification
          path: |
            qa/*.png
            _site/data/feed-health.json
            data/*.json
          retention-days: 7
