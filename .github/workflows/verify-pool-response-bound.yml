name: Verify bounded Ethereum block responses
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-pool-response-bound.yml']
permissions:
  contents: write
concurrency:
  group: verify-pool-response-bound
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Increase only the bounded response allowance and verify both boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          if(execFileSync('git',['hash-object','alerts/pool-feeds.mjs'],{encoding:'utf8'}).trim()!=='1be4bcfd171217e2484d41800554dddf94767208')throw Error('Pool source changed');
          function replace(file,from,to){const t=fs.readFileSync(file,'utf8');if(t.split(from).length!==2)throw Error('Unexpected context in '+file);fs.writeFileSync(file,t.replace(from,to));}
          replace('alerts/pool-feeds.mjs','const MAX_RESPONSE_BYTES = 64 * 1024;',`// Full block responses include transaction hashes, even with full transactions disabled.
          // Retain a hard bound, body cancellation and the existing eight-second deadline.
          const MAX_RESPONSE_BYTES = 1024 * 1024;`);
          replace('tests/pool-feeds.test.mjs',"' '.repeat(64 * 1024 + 1)","' '.repeat(1024 * 1024 + 1)");
          fs.appendFileSync('tests/pool-feeds.test.mjs',`
          test('genuine-sized block responses above 64 KiB retain complete header validation',async()=>{
            const transactions=Array.from({length:1800},(_,i)=>hash(i+1));
            assert(Buffer.byteLength(JSON.stringify(transactions))>64*1024);
            const mock=fixture({change:({stage,results})=>stage===2?results:results.map(item=>item.result?.hash?{...item,result:{...item.result,transactions}}:item)});
            const result=await poll(mock,{coins:['KISHU']});
            assert.deepEqual(result.errors,[]);assert.equal(result.quotes.length,1);
            assert.equal(result.evidence.KISHU.blockHash,mock.current.hash);
            assert.equal(result.evidence.KISHU.token,FIXTURES.KISHU.token);
          });
          `);
          NODE
      - name: Compile and verify every backend and runtime test
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Verify chart and alert browser regressions
        run: |
          npm run build
          npm run test:charts
          npm run test:alerts-browser
      - name: Commit verified fix without overwriting concurrent changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add alerts/pool-feeds.mjs tests/pool-feeds.test.mjs
          git rm .github/workflows/verify-pool-response-bound.yml
          git commit -m 'Accept bounded full Ethereum block responses without weakening validation'
          git push origin HEAD:main
      - name: Publish verified deployment bundle
        run: |
          set -euo pipefail
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const b=fs.readFileSync('.worker-build/worker.js');fs.mkdirSync('deployment-artifacts',{recursive:true});
          fs.writeFileSync('deployment-artifacts/worker.js',b);
          fs.writeFileSync('deployment-artifacts/manifest.json',JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,runId:process.env.GITHUB_RUN_ID,node:process.version,sha256:crypto.createHash('sha256').update(b).digest('hex'),bytes:b.length},null,2)+'\n');
          NODE
          BRANCH="deploy/alerts-${SOURCE_COMMIT:0:12}"
          git checkout -b "$BRANCH"
          git add deployment-artifacts
          git commit -m "Verified bounded-response bundle for $SOURCE_COMMIT"
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-bounded-response-alerts
          path: |
            deployment-artifacts/
            qa/*.png
          retention-days: 7
