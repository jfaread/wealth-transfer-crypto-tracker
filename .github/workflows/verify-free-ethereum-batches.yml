name: Verify free Ethereum batch compatibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-free-ethereum-batches.yml']
permissions:
  contents: write
concurrency:
  group: verify-free-ethereum-batches
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact guarded batch fix and regression tests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          if(execFileSync('git',['hash-object','alerts/pool-feeds.mjs'],{encoding:'utf8'}).trim()!=='507c57fa4353630d99a516280db54bff66595fa4')throw Error('Pool source changed; refusing to overwrite it');
          function replace(file,from,to,count=1){const t=fs.readFileSync(file,'utf8');if(t.split(from).length-1!==count)throw Error('Unexpected context in '+file+': '+from);fs.writeFileSync(file,t.split(from).join(to));}
          replace('alerts/pool-feeds.mjs','export const MAX_RPC_REQUESTS_PER_POLL = 6;','export const MAX_RPC_REQUESTS_PER_POLL = 8;');
          replace('alerts/pool-feeds.mjs',`async function rpcBatch(network, calls, fetchImpl, now) {
            if (!calls.length || calls.length > 20) fail('invalid_batch');`,`async function rpcBatch(network, calls, fetchImpl, now) {
            if (!calls.length || calls.length > 20) fail('invalid_batch');
            // Public dRPC permits three calls per HTTP batch. Preserve all pinned
            // reads, response checks and one shared eight-second state deadline.
            if (network !== 'ethereum' || calls.length <= 3) return rpcChunk(network, calls, fetchImpl, now);
            const deadline = clockValue(now) + RPC_TIMEOUT_MS, values = [];
            for (let offset = 0; offset < calls.length; offset += 3) {
              const remaining = deadline - clockValue(now);
              if (remaining <= 0) fail('rpc_timeout');
              values.push(...await rpcChunk(network, calls.slice(offset, offset + 3), fetchImpl, now, remaining));
              if (clockValue(now) >= deadline) fail('rpc_timeout');
            }
            return values;
          }

          async function rpcChunk(network, calls, fetchImpl, now, timeoutMs = RPC_TIMEOUT_MS) {`);
          replace('alerts/pool-feeds.mjs','    }, RPC_TIMEOUT_MS);','    }, timeoutMs);');
          replace('tests/pool-feeds.test.mjs','const requests = [], stages = {ethereum: 0, bsc: 0};','const requests = [];');
          replace('tests/pool-feeds.test.mjs','const calls = JSON.parse(options.body), stage = ++stages[network];',`const calls = JSON.parse(options.body);
              const stage = calls.every(call => call.method === 'eth_call') ? 2
                : calls[0].method === 'eth_chainId' ? 1 : 3;`);
          replace('tests/pool-feeds.test.mjs','assert(calls.length <= 20);',"assert(calls.length <= (network === 'ethereum' ? 3 : 20));");
          replace('tests/pool-feeds.test.mjs','all three verified pools use six fixed, bounded read-only batches','all three verified pools use eight fixed, bounded read-only batches');
          replace('tests/pool-feeds.test.mjs','MAX_RPC_REQUESTS_PER_POLL, 6','MAX_RPC_REQUESTS_PER_POLL, 8');
          replace('tests/pool-feeds.test.mjs','mock.requests.length, 6','mock.requests.length, 8');
          replace('tests/pool-feeds.test.mjs','follow.requests[2].calls.length','follow.requests.at(-1).calls.length');
          replace('tests/pool-runtime-mock.mjs','calls.length > 20',"calls.length > (network === 'ethereum' ? 3 : 20)");
          replace('tests/worker-runtime.test.mjs','stats.rpcCount, 6','stats.rpcCount, 8');
          replace('tests/worker-runtime.test.mjs','finalStats.rpcCount, 6','finalStats.rpcCount, 8');
          replace('tests/worker.test.mjs','config.limits.maxPoolRpcRequestsPerPoll, 6','config.limits.maxPoolRpcRequestsPerPoll, 8');
          fs.appendFileSync('tests/pool-feeds.test.mjs',`
          test('Ethereum free-tier batches contain at most three calls, all pinned to one verified block', async () => {
            const mock=fixture(), result=await poll(mock);
            assert.deepEqual(result.errors, []);
            assert.deepEqual(mock.requests.filter(r=>r.network==='ethereum').map(r=>r.calls.length), [2,3,3,1,2]);
            assert.deepEqual(mock.requests.filter(r=>r.network==='bsc').map(r=>r.calls.length), [2,13,2]);
            assert.equal(mock.requests.length,MAX_RPC_REQUESTS_PER_POLL);
          });
          test('a rate limit in an Ethereum chunk stops remaining reads and retains Retry-After', async () => {
            const mock=fixture({change:({network,calls,results})=>network==='ethereum' && calls.some(c=>c.params?.[0]?.data==='0x0902f1ac')
              ? new Response(null,{status:429,headers:{'Retry-After':'120'}}):results});
            const result=await poll(mock,{coins:['KISHU']});
            assert.equal(mock.requests.length,3);assert.deepEqual(result.quotes,[]);
            assert.equal(result.errors[0].reason,'rate_limited');assert.equal(result.errors[0].retryAt,NOW+120000);
          });
          test('Ethereum chunks share one deadline and cannot prolong the state-reading window', async () => {
            let clock=NOW;
            const mock=fixture({advance:({stage})=>{if(stage===2)clock+=3000;}});
            const result=await poll(mock,{coins:['KISHU'],now:()=>clock});
            assert.equal(mock.requests.length,4);assert.deepEqual(result.quotes,[]);
            assert.equal(result.errors[0].reason,'rpc_timeout');
          });
          test('out-of-order chunk responses retain exact pool identity and price', async () => {
            const mock=fixture({change:({results})=>[...results].reverse()});
            const result=await poll(mock,{coins:['KISHU']});
            assert.deepEqual(result.errors,[]);assert.equal(result.quotes[0].price,'0.000000000004');
            assert.equal(result.evidence.KISHU.token,FIXTURES.KISHU.token);
          });
          `);
          console.log(execFileSync('git',['diff','--stat'],{encoding:'utf8'}));
          NODE
      - name: Compile and run every backend regression test
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Verify preserved refresh fix and nine-coin mobile interface
        run: |
          npm run build
          npm run test:charts
          npm run test:alerts-browser
      - name: Commit verified source with concurrency guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add alerts/pool-feeds.mjs tests/pool-feeds.test.mjs tests/pool-runtime-mock.mjs tests/worker-runtime.test.mjs tests/worker.test.mjs
          git rm .github/workflows/verify-free-ethereum-batches.yml
          git commit -m 'Respect Ethereum free-tier batch limits within a shared deadline'
          git push origin HEAD:main
      - name: Publish integrity-checked deployment bundle
        run: |
          set -euo pipefail
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const b=fs.readFileSync('.worker-build/worker.js');fs.mkdirSync('deployment-artifacts',{recursive:true});
          fs.writeFileSync('deployment-artifacts/worker.js',b);
          fs.writeFileSync('deployment-artifacts/manifest.json',JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,runId:process.env.GITHUB_RUN_ID,node:process.version,sha256:crypto.createHash('sha256').update(b).digest('hex'),bytes:b.length},null,2)+'\n');
          NODE
          BRANCH="deploy/alerts-${SOURCE_COMMIT:0:12}"
          git checkout -b "$BRANCH"
          git add deployment-artifacts
          git commit -m "Verified free-batch alert bundle for $SOURCE_COMMIT"
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-free-batch-alerts
          path: |
            deployment-artifacts/
            qa/*.png
          retention-days: 7
