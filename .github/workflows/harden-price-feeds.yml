name: Verify and publish feed hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/harden-price-feeds.yml', '.maintenance/feed-hardening.*', '.maintenance/apply-feed-hardening.mjs', 'tests/snapshot-freshness.test.mjs']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  harden:
    if: github.repository == 'jfaread/wealth-transfer-crypto-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply hash-guarded reviewed hardening
        run: node .maintenance/apply-feed-hardening.mjs
      - name: Compile Worker and run complete regression suite
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Collect timestamped data with persistent provider limits
        run: |
          node scripts/refresh-quotes.mjs
          node scripts/refresh-market-data.mjs
      - name: Verify publication, chart, mobile alerts and creator recovery
        run: |
          npm run build
          node scripts/verify-market-publication.mjs
          npm run test:charts
          npm run test:alerts-browser
          node scripts/test-news-browser.cjs
      - name: Save only tested changes without overwriting concurrent work
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo 'Main changed. Refusing to publish obsolete source.'; exit 1; }
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add index.html scripts/market-data-core.mjs scripts/market-client.mjs scripts/refresh-quotes.mjs scripts/refresh-market-data.mjs scripts/build-site.mjs scripts/verify-market-publication.mjs scripts/test-fast-load.cjs tests/market-client-hardening.test.mjs tests/snapshot-hardening.test.mjs tests/browser-data-hardening.test.mjs data
          git rm .maintenance/feed-hardening.* .maintenance/apply-feed-hardening.mjs
          git commit -m 'Harden feed deadlines, persistent cooldowns, quote recovery and publication safety'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-hardening-verification
          path: |
            qa/*.png
            _site/data/feed-health.json
            scripts/
            tests/
          retention-days: 7
