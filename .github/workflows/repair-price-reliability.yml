name: Verify and publish independent price-feed recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-price-reliability.yml', '.maintenance/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'jfaread/wealth-transfer-crypto-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply guarded changes and preserve rolling history edges
        run: |
          node .maintenance/refine-price-reliability.cjs
          node .maintenance/apply-price-reliability.cjs
      - name: Compile Worker and run all backend, data-validation and runtime tests
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Refresh current quotes before repairing genuine recent history
        run: |
          node scripts/refresh-quotes.mjs
          node scripts/refresh-market-data.mjs
      - name: Test chart, partial history recovery, notifications and creator updates
        run: |
          npm run build
          npm run test:charts
          npm run test:alerts-browser
          node scripts/test-news-browser.cjs
      - name: Save verified application and data changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo 'Main changed; refusing to overwrite concurrent work.'; exit 1; }
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add index.html scripts/build-site.mjs scripts/test-fast-load.cjs scripts/refresh-market-data.mjs scripts/refresh-quotes.mjs scripts/market-data-core.mjs tests/market-data-core.test.mjs data
          git add -u .maintenance
          git rm .maintenance/apply-price-reliability.cjs .maintenance/fetch-aggregate.txt .maintenance/repair-history.txt .maintenance/refine-price-reliability.cjs
          git commit -m 'Keep independent price histories, recover partial feeds and reduce redundant provider requests'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-reliability-verification
          path: |
            qa/*.png
            data/
            index.html
            scripts/
            tests/
          retention-days: 7
