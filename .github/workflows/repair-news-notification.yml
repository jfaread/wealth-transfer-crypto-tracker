name: Restore creator updates and clarify test notifications
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-news-notification.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'jfaread/wealth-transfer-crypto-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact guarded UI repair
        run: node .maintenance/repair-news.cjs
      - name: Refresh verified public creator metadata
        run: node scripts/refresh-creator-updates.mjs
      - name: Verify all backend and source-validation tests
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Verify chart, notification clarity and five-update recovery
        run: |
          npm run build
          npm run test:charts
          npm run test:alerts-browser
          node scripts/test-news-browser.cjs
      - name: Save only verified changes without overwriting concurrent work
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo 'Main changed during verification. No source or website was overwritten.'; exit 1; }
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add index.html assets/alerts.js scripts/test-alerts-browser.cjs scripts/test-news-browser.cjs tests/news.test.mjs data/jon-george.json .github/workflows/market-data.yml
          git add -u .maintenance
          git rm .maintenance/repair-news.cjs .github/workflows/repair-news-notification.yml
          git commit -m 'Restore five direct Jon George updates and make test notification receipt clear'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-and-notification-verification
          path: qa/*.png
          retention-days: 7
