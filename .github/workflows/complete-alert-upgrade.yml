name: Complete and verify nine-coin alert upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-alert-upgrade.yml']
permissions:
  contents: write
concurrency:
  group: complete-nine-coin-alert-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == 'jfaread/wealth-transfer-crypto-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply the exact reviewed upgrade and complete closed-network fixtures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const original=execFileSync('git',['show','a75d93db61732203e7aa100593165118bd84f65c:.github/workflows/complete-alert-upgrade.yml'],{encoding:'utf8'});
          const match=original.match(/          node --input-type=module <<'NODE'\n([\s\S]*?)\n          NODE/);
          if(!match)throw Error('Pinned source transformation is missing');
          const code=match[1].split('\n').map(line=>{if(!line.startsWith('          '))throw Error('Unexpected script indentation');return line.slice(10);}).join('\n');
          execFileSync(process.execPath,['--input-type=module'],{input:code,stdio:['pipe','inherit','inherit']});
          function replace(file,from,to){const text=fs.readFileSync(file,'utf8');if(text.split(from).length!==2)throw Error('Ambiguous fixture change: '+file);fs.writeFileSync(file,text.replace(from,to));}
          replace('tests/pool-runtime-mock.mjs',"'SOL/USD': 100}","'SOL/USD': 100, 'SHIB/USD': 0.00000415}");
          const marker="        if (request.method === 'POST' && url.href === ";
          const closedRest="        if (request.method === 'GET' && url.origin === 'https://api.kraken.com' && url.pathname === '/0/public/Trades' && /^(BTC|ETH|BNB|XRP|SOL|SHIB)USD$/.test(url.searchParams.get('pair') || '') && url.searchParams.get('count') === '1' && url.searchParams.get('assetVersion') === '1') {\n          return new Response(null, {status:429, headers:{'Retry-After':'120'}});\n        }\n";
          replace('tests/worker-runtime.test.mjs',marker,closedRest+marker);
          replace('scripts/test-alerts-browser.cjs','   assert.deepEqual(errors,[]);\n   console.log',`   assert.deepEqual(errors,[]);
             assert.equal(await page.locator('#wa-coin option').count(),9);
             await add(page,'SHIB','0.000004150000000001');
             assert.equal(await page.locator('#wa-draft-rules .wa-rule').count(),2);
             const shibDraft=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)).drafts.find(rule=>rule.coin==='SHIB'),KEY);
             assert.equal(shibDraft.threshold,'0.000004150000000001');
             assert.equal(await page.evaluate(key=>JSON.parse(localStorage.getItem(key)).auth,KEY),null);
             assert.match(await page.locator('#wa-message').innerText(),/not active/);
             assert.equal(await page.evaluate(()=>window.__alertProbe.permissions),0);
             assert.equal(await page.locator('#wa-server-section').isVisible(),false);
             console.log`);
          console.log(execFileSync('git',['diff','--stat'],{encoding:'utf8'}));
          NODE
      - name: Verify Worker bundle and all backend regression tests
        run: |
          npm run check:worker -- --minify
          npm test
      - name: Verify nine-coin chart and mobile alert controls
        run: |
          npm run build
          npm run test:charts
          npm run test:alerts-browser
      - name: Commit verified source without overwriting concurrent changes
        run: |
          set -euo pipefail
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA" || { echo 'Main changed during verification; refusing to overwrite it.'; exit 1; }
          git config user.name 'crypto-watch-build'
          git config user.email 'crypto-watch-build@users.noreply.github.com'
          git add alerts/core.mjs alerts/feeds.mjs alerts/rest-feed.mjs alerts/worker.mjs assets/alerts.js index.html tests/feeds.test.mjs tests/core.test.mjs tests/worker.test.mjs tests/worker-runtime.test.mjs tests/rest-feed.test.mjs tests/shib-and-gateway.test.mjs tests/pool-runtime-mock.mjs scripts/test-alerts-browser.cjs README.md
          git rm .github/workflows/complete-alert-upgrade.yml
          git commit -m 'Support SHIB alerts and recover securely from streaming gateway errors'
          git push origin HEAD:main
      - name: Publish integrity-checked deployment bundle
        run: |
          set -euo pipefail
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const bytes=fs.readFileSync('.worker-build/worker.js');fs.mkdirSync('deployment-artifacts',{recursive:true});
          fs.writeFileSync('deployment-artifacts/worker.js',bytes);
          fs.writeFileSync('deployment-artifacts/manifest.json',JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,runId:process.env.GITHUB_RUN_ID,node:process.version,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length},null,2)+'\n');
          NODE
          BRANCH="deploy/alerts-${SOURCE_COMMIT:0:12}"
          git checkout -b "$BRANCH"
          git add deployment-artifacts
          git commit -m "Verified nine-coin alert bundle for $SOURCE_COMMIT"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Source: $SOURCE_COMMIT; deployment branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-coin-alert-verification
          path: |
            deployment-artifacts/
            alerts/
            tests/
            assets/
            scripts/
            index.html
            README.md
            package*.json
            qa/*.png
          retention-days: 7
