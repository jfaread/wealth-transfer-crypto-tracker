name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'alerts-config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/refresh-quotes.mjs'
      - 'scripts/market-data-core.mjs'
      - 'scripts/refresh-creator-updates.mjs'
      - 'data/jon-george.json'
      - 'scripts/test-fast-load.cjs'
      - 'scripts/test-news-browser.cjs'
      - 'scripts/build-site.mjs'
      - 'scripts/refresh-market-data.mjs'
      - '.github/workflows/market-data.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Verify and cache current quotes independently
        run: node scripts/refresh-quotes.mjs
      # Recent and yearly windows have independent clocks. Valid histories are
      # reused; unsuccessful providers cannot erase successful coin updates.
      - name: Repair due historical windows without discarding good data
        run: node scripts/refresh-market-data.mjs
      - name: Cache the latest five public Jon George updates
        run: node scripts/refresh-creator-updates.mjs
      - name: Commit verified public prices and creator metadata
        run: |
          git config user.name 'crypto-tracker-data'
          git config user.email 'crypto-tracker-data@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public market and creator data'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare static site
        run: node scripts/build-site.mjs
      - name: Verify data safety, charts, mobile alerts and creator recovery
        timeout-minutes: 4
        if: github.event_name == 'push'
        run: |
          npm ci --ignore-scripts
          npm run check:worker -- --minify
          npm test
          node scripts/test-fast-load.cjs
          node scripts/test-alerts-browser.cjs
          node scripts/test-news-browser.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
