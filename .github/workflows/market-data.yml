name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/refresh-market-data.mjs'
      - '.github/workflows/market-data.yml'
permissions:
  contents: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-market-data.mjs
      - name: Commit verified public prices
        run: |
          git config user.name 'crypto-tracker-data'
          git config user.email 'crypto-tracker-data@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public market history'
            git push
          fi
