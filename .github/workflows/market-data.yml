name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'alerts-config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/refresh-quotes.mjs'
      - 'scripts/test-fast-load.cjs'
      - 'scripts/build-site.mjs'
      - 'scripts/refresh-market-data.mjs'
      - '.github/workflows/market-data.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: true
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - run: node scripts/refresh-market-data.mjs
        env:
          REUSE_MARKET_DATA: ${{ github.event_name == 'push' && 'true' || 'false' }}
      - name: Verify and cache current quotes
        run: node scripts/refresh-quotes.mjs
      - name: Commit verified public prices
        run: |
          git config user.name 'crypto-tracker-data'
          git config user.email 'crypto-tracker-data@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public market history'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare static site
        run: |
          node scripts/build-site.mjs
      - name: Verify fast loading and responsive layout
        timeout-minutes: 2
        if: github.event_name == 'push'
        run: |
          npm ci --ignore-scripts
          node scripts/test-fast-load.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
