name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'index.html'
      - 'scripts/refresh-market-data.mjs'
      - '.github/workflows/market-data.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-market-data.mjs
      - name: Commit verified public prices
        run: |
          git config user.name 'crypto-tracker-data'
          git config user.email 'crypto-tracker-data@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public market history'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
