name: Verify native XRP sound companion
on:
  workflow_dispatch:
  push:
    branches: [feature/ios-native-xrp-sound]
    paths:
      - 'ios/CryptoWatchSoundCompanion/**'
      - 'alerts/**'
      - 'index.html'
      - 'assets/alerts.js'
      - '.github/workflows/verify-native-xrp-sound.yml'
permissions:
  contents: read
jobs:
  native-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - run: npm ci --ignore-scripts
      - name: Compile and test original Web Push monitor and dormant native bridge
        run: |
          npm run check:worker -- --minify
          npm test
          npm run build
          npm run test:alerts-browser
      - name: Verify APNs payload and secure native pairing without contacting Apple
        run: node --test ios/CryptoWatchSoundCompanion/Server/*.test.mjs
  ios-simulator-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/CryptoWatchSoundCompanion
        run: xcodegen generate
      - name: Compile without signing or installing
        working-directory: ios/CryptoWatchSoundCompanion
        run: |
          xcodebuild -project CryptoWatchSoundCompanion.xcodeproj \
            -scheme CryptoWatchSoundCompanion -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
